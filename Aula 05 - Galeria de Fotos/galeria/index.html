<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title> Galeria </title>
</head>
<body>
    <form class="formulario">
        <input type="text" id="foto" placeholder="Digite a url da imagem">
        <button type="button"> CADASTRAR </button>
    </form>
    <div class="galeria" id="galeria">
        <img src="./assets/knight.webp" alt="Knight">
        <img src="./assets/hornet.jpg" alt="Hornet">
        <img src="./assets/Quirrel.webp" alt="Quirrel">
        <img src="./assets/lace.jfif" alt="Lace">
        <img src="./assets/primeirapecadora.png" alt="Primeira Pecadora">
        <img src="./assets/dancarinosmecanicos.jpg" alt="Dançarinos Mecânicos">
        <img src="./assets/irmasdebatalha.jpg" alt="Irmãs de Batalha">
        <img src="./assets/grimm.jpeg" alt="Grimm Rei do Pesadelo">
        <img src="./assets/pureknight.jpg" alt="Receptáculo Puro">
    </div>
    <script src="./script.js" defer></script>
</body>
</html>
